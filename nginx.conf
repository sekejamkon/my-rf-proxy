server {
    listen 80;
    server_name _;

    location / {
        proxy_pass https://musical-spoon-qvq594gq54qv3x6x7-443.app.github.dev;
        
        # این خطوط برای عبور صحیح ترافیک VLESS حیاتی هستند
        proxy_set_header Host musical-spoon-qvq594gq54qv3x6x7-443.app.github.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # تنظیمات مخصوص WebSocket و gRPC
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}
